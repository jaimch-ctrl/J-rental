<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>J攝影師租機｜管理後台</title>
<style>
:root{--bg:#0d1626;--panel:#16233a;--panel2:#1d2d49;--line:#30435f;--text:#f2f5fa;--muted:#a9b6c9;--gold:#e9b949;--goldt:#1b1403;--green:#4fd18b;--rose:#fb7185}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-weight:600;font-size:16px;line-height:1.55;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
#app{max-width:640px;margin:0 auto;padding:18px 14px 60px}
h1{font-size:24px;font-weight:900;color:var(--gold);margin:6px 0 14px}
label{display:block;font-size:15px;margin:12px 0 4px}
input,select,textarea{width:100%;min-height:46px;padding:9px 11px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;font-size:16px;font-weight:600;font-family:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
button{font-family:inherit;cursor:pointer}
.btn{min-height:46px;padding:8px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel2);color:var(--text);font-size:15px;font-weight:800}
.btn.main{background:var(--gold);border-color:var(--gold);color:var(--goldt)}
.btn.danger{color:var(--rose);border-color:var(--rose);background:transparent}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs button{flex:1 0 auto;min-height:44px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--muted);font-weight:800;font-size:15px}
.tabs button[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--goldt)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;margin:0 0 12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.id{font-weight:900;color:var(--gold);overflow-wrap:anywhere}
.pill{flex:none;padding:2px 10px;border-radius:999px;font-size:14px;border:1px solid var(--muted);color:var(--muted)}
.pill.warn{border-color:var(--gold);color:var(--gold)}.pill.good{border-color:var(--green);color:var(--green)}.pill.bad{border-color:var(--rose);color:var(--rose)}
.name{font-size:19px;font-weight:900;margin-top:6px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv span:first-child{color:var(--muted);flex:none}
.kv span:last-child{text-align:right;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.acts .btn{flex:1 1 30%}
.links{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
.links a{color:var(--gold);padding:6px 0}
.muted{color:var(--muted)}
.err{color:var(--rose);min-height:1.5em;margin:8px 0 0}
#modal{position:fixed;inset:0;background:rgba(5,10,20,.75);display:flex;align-items:flex-end;justify-content:center;z-index:10}
#sheet{background:var(--panel);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
#sheet h2{margin:0 0 6px;font-size:20px;color:var(--gold)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preview{margin-top:12px;padding:10px 12px;background:var(--panel2);border-radius:10px}
.bar{display:flex;gap:8px;margin-top:14px}.bar .btn{flex:1}
[hidden]{display:none!important}
#print{display:none}
@media print{
  body{background:#fff;color:#000;font-weight:400}
  #app,#modal,.noprint{display:none!important}
  #print,#print.show{display:block!important;position:static!important;overflow:visible!important;padding:0!important}
}
#print.show{display:block;position:fixed;inset:0;background:#fff;color:#000;overflow:auto;z-index:20;padding:16px;font-weight:400}
#print.show .doc{max-width:720px;margin:0 auto}
.doc h3{font-size:24px;text-align:center;margin:0 0 6px}
.doc h4{font-size:18px;margin:16px 0 6px}
.doc p{margin:3px 0;line-height:1.7;font-size:15px}
.doc p.s{font-weight:800}
.doc .box{border:1px solid #000;padding:8px 12px;margin:8px 0}
.printbar{display:flex;gap:8px;max-width:720px;margin:0 auto 12px}
.printbar .btn{flex:1;background:#fff;color:#000;border-color:#000}
</style>
</head>
<body>
<div id="app">
  <h1>J攝影師租機｜後台</h1>
  <form id="login">
    <label for="pw">後台密碼</label>
    <input id="pw" type="password" autocomplete="current-password">
    <p class="err" id="loginErr" role="alert"></p>
    <button class="btn main" style="width:100%" type="submit">登入</button>
  </form>
  <div id="panel" hidden>
    <div class="tabs" id="tabs"></div>
    <div id="list"></div>
    <button class="btn" style="width:100%" id="reload">重新整理</button>
  </div>
</div>
<div id="modal" hidden><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="print"></div>
<script src="core.js"></script>
<script>
var $=function(id){return document.getElementById(id)};
var A={pw:'',orders:[],shop:{},now:null,tab:'todo'};
var TABS=[['todo','待處理',['待審核','待匯款','待對帳','已確認']],['out','出租中',['已取機']],['all','全部',null]];
var PILL={'待審核':'warn','證件未通過':'bad','待對帳':'warn','待匯款':'warn','已確認':'good','已取機':'good','已取消':'bad','逾期未付':'bad'};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function api(q){q.password=A.pw;return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(q)}).then(function(r){return r.json()})}
function today(){return dateOf(A.now||fmtMs(Date.now()))}
function load(){
  return api({action:'admin_list'}).then(function(r){
    if(!r.ok)throw new Error(r.err);
    A.orders=r.orders;A.shop=r.shop;A.now=r.now;
    $('login').hidden=true;$('panel').hidden=false;
    try{sessionStorage.setItem('pw',A.pw)}catch(e){}
    render();
  });
}
function render(){
  var t=$('tabs');t.textContent='';
  TABS.forEach(function(x){
    var c=x[2]?A.orders.filter(function(o){return x[2].indexOf(o.status)>=0}).length:A.orders.length;
    var b=el('button','',x[1]+' '+c);b.type='button';b.setAttribute('aria-pressed',A.tab===x[0]?'true':'false');
    b.onclick=function(){A.tab=x[0];render()};t.appendChild(b);
  });
  var tab=TABS.filter(function(x){return x[0]===A.tab})[0],list=A.orders.slice();
  if(tab[2]){list=list.filter(function(o){return tab[2].indexOf(o.status)>=0});list.sort(function(a,b){return a.start<b.start?-1:1})}
  var box=$('list');box.textContent='';
  if(!list.length)box.appendChild(el('p','muted','目前沒有訂單。'));
  list.forEach(function(o){box.appendChild(card(o))});
}
function kv(p,a,b){var r=el('div','kv');r.appendChild(el('span','',a));r.appendChild(el('span','',b));p.appendChild(r)}
function card(o){
  var c=el('div','card'),top=el('div','top');
  top.appendChild(el('span','id',o.id));top.appendChild(el('span','pill '+(PILL[o.status]||''),o.status));c.appendChild(top);
  c.appendChild(el('div','name',o.name+'　'+o.phone));
  if(o.social)c.appendChild(el('div','muted','IG／脆：'+o.social));
  kv(c,'配備',o.equipLabel);kv(c,'方案',o.planLabel);kv(c,'取機',o.start);kv(c,'歸還',o.end);kv(c,'面交地點',o.place);
  if(o.event)kv(c,'活動',o.event);
  kv(c,'租金／押金',money(o.rent)+'／'+money(o.deposit)+'（'+o.region+'）');
  kv(c,'預約金',money(o.prepay));kv(c,'取機應付',money(o.dueAtPickup));
  if(o.status==='待匯款')kv(c,'匯款期限',o.deadline);
  if(o.last5)kv(c,'匯款後五碼',o.last5);
  if(o.refCode)kv(c,'介紹碼',o.refCode);
  if(o.unit)kv(c,'序號／編號',o.unit);
  if(o.extendFee)kv(c,'加租費',money(o.extendFee));
  if(o.status==='已歸還'){kv(c,'實際歸還',o.returnedAt);kv(c,'逾時費',money(o.lateFee));kv(c,'其他費用',money(o.otherFee));kv(c,'押金退還',money(o.depositBack));if(o.shortfall)kv(c,'應另收',money(o.shortfall))}
  if(o.status==='已取消'){kv(c,'取消原因',o.cancelReason);kv(c,'應退預約金',money(o.refund))}
  if(o.addonFee||o.power||o.transferQty)kv(c,'加購',(o.power?'行動電源 ':'')+(o.transferQty?'照片導出 '+o.transferQty+' 次 ':'')+money(o.addonFee));
  if(o.status==='證件未通過')kv(c,'未通過原因',o.rejectReason);
  kv(c,'線上簽約',o.signedAt?('已簽 '+o.signedAt):'尚未簽約');
  if(o.status==='已歸還'&&o.transferExtra)kv(c,'還機加購導出',money(o.transferExtra));
  if(o.idDeleted)kv(c,'證件檔案','已刪除 '+o.idDeleted);
  if(o.note)kv(c,'備註',o.note);
  var ln=el('div','links');
  function link(u,t){if(!/^https:\/\//.test(u||''))return;var x=el('a','',t);x.href=u;x.target='_blank';x.rel='noopener';ln.appendChild(x)}
  if(o.idFolder&&!o.idDeleted)link('https://drive.google.com/drive/folders/'+encodeURIComponent(o.idFolder),'查看證件 ↗');
  if(o.contractUrl)link(o.contractUrl,'已簽合約 ↗');
  if(ln.childNodes.length)c.appendChild(ln);
  var a=el('div','acts');
  function act(t,f,cls){var b=el('button','btn '+(cls||''),t);b.type='button';b.onclick=f;a.appendChild(b)}
  if(o.status==='待審核'){act('證件通過',function(){dlgReview(o,true)},'main');act('證件不通過',function(){dlgReview(o,false)},'danger')}
  if(['待匯款','待對帳','逾期未付'].indexOf(o.status)>=0)act('確認入帳',function(){dlgConfirm(o)},'main');
  if(o.status==='已確認')act('登記取機',function(){dlgPickup(o)},'main');
  if(o.status==='已取機')act('登記歸還',function(){dlgReturn(o)},'main');
  if(['已確認','已取機'].indexOf(o.status)>=0)act('延長時間',function(){dlgExtend(o)});
  if(['待審核','待匯款','待對帳','已確認'].indexOf(o.status)>=0&&!o.reschedules)act('改期',function(){dlgResch(o)});
  if(['已確認','已取機','已歸還'].indexOf(o.status)>=0)act('列印合約',function(){showContract(o)});
  act('備註',function(){dlgNote(o)});
  if(['待審核','待匯款','待對帳','已確認'].indexOf(o.status)>=0)act('取消訂單',function(){dlgCancel(o)},'danger');
  if(['已歸還','已取消','證件未通過','逾期未付'].indexOf(o.status)>=0&&o.idFolder&&!o.idDeleted)act('刪除證件檔案',function(){dlgDeleteIds(o)},'danger');
  c.appendChild(a);
  return c;
}
/* ---- 對話框 ---- */
function modal(title,build,onOk,okText){
  var s=$('sheet');s.textContent='';s.appendChild(el('h2','',title));
  var body=el('div');s.appendChild(body);build(body);
  var e=el('p','err');e.setAttribute('role','alert');s.appendChild(e);
  var bar=el('div','bar'),no=el('button','btn','取消返回'),ok=el('button','btn main',okText||'確定');no.type=ok.type='button';
  no.onclick=close;
  ok.onclick=function(){
    var q;try{q=onOk()}catch(x){e.textContent=x.message;return}
    ok.disabled=true;e.textContent='';
    api(q).then(function(r){ok.disabled=false;if(!r.ok){e.textContent=r.err;return}close();load()}).catch(function(){ok.disabled=false;e.textContent='連線失敗，請再試一次'});
  };
  bar.appendChild(no);bar.appendChild(ok);s.appendChild(bar);$('modal').hidden=false;
}
function close(){$('modal').hidden=true}
function field(p,label,tag,attrs){
  var id='f'+Math.random().toString(36).slice(2,8),l=el('label','',label);l.htmlFor=id;p.appendChild(l);
  var i=document.createElement(tag||'input');i.id=id;for(var k in (attrs||{}))i[k]=attrs[k];p.appendChild(i);return i;
}
function slotSelect(p,label,val){
  var s=field(p,label,'select');timeSlots().forEach(function(t){var o=el('option','',t);o.value=t;s.appendChild(o)});if(val)s.value=val;return s;
}
function nowParts(){var n=A.now||fmtMs(Date.now());return{d:dateOf(n),t:timeOf(n)}}
function dlgConfirm(o){modal('確認入帳',function(b){
  b.appendChild(el('p','','請確認已收到 '+money(o.prepay)+(o.last5?'，帳號後五碼 '+o.last5:'')+'。'));
},function(){return{action:'admin_confirm',id:o.id}},'確認已入帳')}
function dlgReview(o,ok){var r;modal(ok?'證件通過':'證件不通過',function(b){
  b.appendChild(el('p','',ok?'通過後客人查詢訂單就會看到匯款帳號，匯款期限從現在起算 24 小時。':'檔期會釋出，客人查詢訂單會看到原因。'));
  if(!ok)r=field(b,'未通過原因（客人看得到）','input',{type:'text',maxLength:200,value:'證件不清楚，請重新預約並上傳清楚照片'});
},function(){return{action:'admin_review',id:o.id,ok:ok,reason:r?r.value:''}},ok?'確認通過':'確認不通過')}
function dlgDeleteIds(o){modal('刪除證件檔案',function(b){
  b.appendChild(el('p','','會把這筆訂單的身分證與第二證件照片移到雲端硬碟垃圾桶，已簽合約保留。合約約定結案且無爭議後 30 日內刪除。'));
},function(){return{action:'admin_delete_ids',id:o.id}},'確認刪除')}
function dlgPickup(o){var u;modal('登記取機',function(b){
  b.appendChild(el('p','','收取 '+money(o.dueAtPickup)+'，核對證件正本'+(o.signedAt?'。客人已線上簽約。':'。客人尚未線上簽約，請請客人先簽約或簽紙本。')));
  u=field(b,'手機序號或增距鏡編號（選填）','input',{type:'text',maxLength:80});
},function(){return{action:'admin_pickup',id:o.id,unit:u.value}},'確認取機')}
function dlgReturn(o){var d,t,x,xt,pv,n=nowParts();
  function up(){
    var a=d.value+' '+t.value,other=Math.max(0,Math.round(+x.value||0));pv.textContent='';
    if(isNaN(toMs(a))){pv.textContent='請填寫實際歸還時間';return}
    var tr=Math.max(0,Math.floor(+xt.value||0))*RULES.addons.transferEach;
    var late=lateFee(o.end,a,o.daily),owed=(o.extendFee||0)+late+other+tr;
    [['約定歸還',o.end],['逾時費',money(late)],['加租費',money(o.extendFee)],['加購導出',money(tr)],['其他費用',money(other)],['押金退還',money(Math.max(0,o.deposit-owed))]].forEach(function(r){kv(pv,r[0],r[1])});
    if(owed>o.deposit)kv(pv,'應另收',money(owed-o.deposit));
  }
  modal('登記歸還',function(b){
    var r=el('div','row');b.appendChild(r);var c1=el('div'),c2=el('div');r.appendChild(c1);r.appendChild(c2);
    d=field(c1,'歸還日期','input',{type:'date',value:n.d});t=field(c2,'歸還時間','input',{type:'time',value:n.t});
    var tx=field(b,'還機時加購照片導出（次，每次 NT$'+RULES.addons.transferEach+'）','input',{type:'number',min:'0',inputMode:'numeric',value:'0'});xt=tx;
    x=field(b,'損壞或其他費用（元）','input',{type:'number',min:'0',inputMode:'numeric',value:'0'});
    pv=el('div','preview');b.appendChild(pv);[d,t,x,xt].forEach(function(i){i.oninput=up});up();
  },function(){return{action:'admin_return',id:o.id,actual:d.value+' '+t.value,other:x.value,extraTransfer:xt.value}},'確認歸還');
}
function dlgExtend(o){var d,t,pv;
  function up(){pv.textContent='';var a=d.value+' '+t.value;if(isNaN(toMs(a))||toMs(a)<=toMs(o.end)){pv.textContent='新時間需晚於 '+o.end;return}kv(pv,'加租費',money(extendFee(o.end,a)))}
  modal('延長時間',function(b){
    b.appendChild(el('p','muted','每小時 NT$100，不足一小時以一小時計。'));
    var r=el('div','row');b.appendChild(r);var c1=el('div'),c2=el('div');r.appendChild(c1);r.appendChild(c2);
    d=field(c1,'新歸還日期','input',{type:'date',value:dateOf(o.end)});t=field(c2,'新歸還時間','input',{type:'time',value:timeOf(o.end)});
    pv=el('div','preview');b.appendChild(pv);[d,t].forEach(function(i){i.oninput=up});up();
  },function(){return{action:'admin_extend',id:o.id,newEnd:d.value+' '+t.value}},'確認延長');
}
function dlgResch(o){var ds,ts,de,te,r0;modal('改期（限一次）',function(b){
  r0=field(b,'改期原因','select');[['customer','客人改期（取機 3 日前）'],['event','活動遭取消或延期']].forEach(function(x){var e=el('option','',x[1]);e.value=x[0];r0.appendChild(e)});
  var r=el('div','row');b.appendChild(r);var c1=el('div'),c2=el('div');r.appendChild(c1);r.appendChild(c2);
  ds=field(c1,'新取機日','input',{type:'date',value:dateOf(o.start)});ts=slotSelect(c2,'新取機時間',timeOf(o.start));
  var r2=el('div','row');b.appendChild(r2);var c3=el('div'),c4=el('div');r2.appendChild(c3);r2.appendChild(c4);
  de=field(c3,'新歸還日','input',{type:'date',value:dateOf(o.end)});te=slotSelect(c4,'新歸還時間',timeOf(o.end));
},function(){return{action:'admin_reschedule',id:o.id,reason:r0.value,start:ds.value+' '+ts.value,end:de.value+' '+te.value}},'確認改期')}
function dlgCancel(o){var r,pv;
  function up(){pv.textContent='';kv(pv,'應退預約金',money(cancelRefund(o.prepay,dateOf(o.start),today(),r.value,['待對帳','已確認'].indexOf(o.status)>=0)))}
  modal('取消訂單',function(b){
    r=field(b,'取消原因','select');[['customer','客人取消'],['noshow','未到場'],['owner','甲方因素（加倍返還）']].forEach(function(x){var e=el('option','',x[1]);e.value=x[0];r.appendChild(e)});
    pv=el('div','preview');b.appendChild(pv);r.onchange=up;up();
  },function(){return{action:'admin_cancel',id:o.id,reason:r.value}},'確認取消');
}
function dlgNote(o){var n;modal('備註',function(b){n=field(b,'備註內容','textarea',{rows:4,maxLength:500,value:o.note||''})},function(){return{action:'admin_note',id:o.id,note:n.value}},'儲存')}

/* ---- 合約 ---- */
function showContract(o){
  var p=$('print');p.textContent='';p.className='show';
  var bar=el('div','printbar noprint'),b1=el('button','btn','列印／存成 PDF'),b2=el('button','btn','關閉');b1.type=b2.type='button';
  b1.onclick=function(){window.print()};b2.onclick=function(){p.className='';p.textContent=''};bar.appendChild(b1);bar.appendChild(b2);p.appendChild(bar);
  var d=el('div','doc'),box=null;
  contractLines(o,A.shop).forEach(function(c){
    if(c.k==='box'){if(!box){box=el('div','box');d.appendChild(box)}box.appendChild(el('p','',c.t));return}
    box=null;
    d.appendChild(el(c.k==='h1'?'h3':c.k==='h2'?'h4':'p',c.k==='s'?'s':'',c.t));
  });
  p.appendChild(d);p.scrollTop=0;
}
$('login').onsubmit=function(ev){ev.preventDefault();A.pw=$('pw').value;$('loginErr').textContent='';load().catch(function(e){$('loginErr').textContent=e.message||'連線失敗'})};
$('reload').onclick=function(){load().catch(function(){})};
(function(){
  if(API_URL.indexOf('https://')!==0){$('loginErr').textContent='尚未設定後端網址，請先完成安裝。';return}
  var saved='';try{saved=sessionStorage.getItem('pw')||''}catch(e){}
  if(saved){A.pw=saved;load().catch(function(){try{sessionStorage.removeItem('pw')}catch(e){}})}
})();
</script>
</body>
</html>
