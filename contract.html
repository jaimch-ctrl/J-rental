<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>租賃合約範本</title>
<style>
body{margin:0;background:#0d1626;color:#f2f5fa;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.bar{max-width:760px;margin:0 auto;padding:18px 16px 10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.bar a{color:#e9b949;font-weight:700;padding:8px 0}
.bar button{min-height:48px;padding:8px 18px;border:0;border-radius:12px;background:#e9b949;color:#1b1403;font-weight:900;font-size:16px;font-family:inherit;cursor:pointer}
.doc{max-width:760px;margin:0 auto 40px;background:#fff;color:#111;border-radius:12px;padding:22px 20px;line-height:1.75;font-size:15.5px}
.doc h3{text-align:center;font-size:23px;margin:0 0 8px}.doc h4{font-size:17px;margin:16px 0 6px}.doc p{margin:2px 0}.doc .s{font-weight:700}
.doc .bx{border:1px solid #333;padding:8px 12px;margin:8px 0}
.note{max-width:760px;margin:0 auto;padding:0 16px 10px;color:#a9b6c9;font-size:14px}
@media print{body{background:#fff}.bar,.note{display:none}.doc{padding:0;margin:0;border-radius:0;font-size:12pt}}
</style>
</head>
<body>
<div class="bar"><a href="./">‹ 回預約頁</a><button type="button" id="pr">列印／存成 PDF</button></div>
<p class="note">此為空白範本，實際金額與日期於預約成立後帶入。iPhone／iPad 按「列印」後，可在列印預覽用兩指放大，再分享存成 PDF。</p>
<div class="doc" id="doc"></div>
<script src="core.js"></script>
<script>
function draw(shop){
  var d=document.getElementById('doc'),bx=null;d.textContent='';
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;e.textContent=x;return e}
  contractLines(null,shop).forEach(function(c){
    if(c.k==='box'){if(!bx){bx=document.createElement('div');bx.className='bx';d.appendChild(bx)}bx.appendChild(el('p','',c.t));return}
    bx=null;d.appendChild(el(c.k==='h1'?'h3':c.k==='h2'?'h4':'p',c.k==='s'?'s':'',c.t));
  });
}
draw(null);
document.getElementById('pr').onclick=function(){window.print()};
if(API_URL.indexOf('https://')===0)fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'availability'})}).then(function(r){return r.json()}).then(function(r){if(r.ok&&r.shop){draw({name:r.shop});document.title='租賃合約範本｜'+r.shop}}).catch(function(){});
</script>
</body>
</html>
